
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple and productive task management app.">
  <title>To Do App</title>

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <main class="app-container">

    <header class="app-header">
      <h1>To Do App</h1>
      <p>Organize your day, one task at a time.</p>
    </header>

    <section class="task-form-section" aria-label="Add a new task">
      <form id="task-form">
        <label for="task-input">What needs to be done?</label>

        <div class="input-group">
          <input
            type="text"
            id="task-input"
            name="task"
            placeholder="Enter a new task..."
            autocomplete="off"
            maxlength="150"
            required
          >

          <button type="submit" id="add-task-btn">
            Add Task
          </button>
        </div>
      </form>
    </section>

    <section class="task-summary" aria-label="Task summary">
      <div class="summary-item">
        <span id="total-tasks">0</span>
        <p>Total Tasks</p>
      </div>

      <div class="summary-item">
        <span id="active-tasks">0</span>
        <p>Active</p>
      </div>

      <div class="summary-item">
        <span id="completed-tasks">0</span>
        <p>Completed</p>
      </div>
    </section>

    <section class="task-list-section" aria-label="Your tasks">

      <div class="task-list-header">
        <h2>My Tasks</h2>

        <button type="button" id="clear-completed-btn">
          Clear Completed
        </button>
      </div>

      <nav class="task-filters" aria-label="Filter tasks">
        <button
          type="button"
          class="filter-btn active"
          data-filter="all"
          aria-pressed="true"
        >
          All
        </button>

        <button
          type="button"
          class="filter-btn"
          data-filter="active"
          aria-pressed="false"
        >
          Active
        </button>

        <button
          type="button"
          class="filter-btn"
          data-filter="completed"
          aria-pressed="false"
        >
          Completed
        </button>
      </nav>

      <ul id="task-list" aria-live="polite">
        <!-- JavaScript will add task items here. -->
      </ul>

      <p id="empty-message">
        No tasks yet. Add your first task!
      </p>

    </section>

    <footer class="app-footer">
      <p>Stay focused. Keep making progress.</p>
    </footer>

  </main>

</body>
</html>
